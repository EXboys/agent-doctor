[package]
name = "agent-doctor-voice"
description = "On-device speech recognition and spoken replies for Ask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSLocale", "NSError"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Globalization",
    "Media_Core",
    "Media_Playback",
    "Media_SpeechRecognition",
    "Media_SpeechSynthesis",
    "Storage_Streams",
] }
