[package]
name = "agent-doctor-core"
description = "Shared discovery, doctor, and company profile logic for Agent Doctor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
agent-doctor-mcp = { workspace = true }
anyhow.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
toml = "1.1.2"
toml_edit.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = "2.2"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2"
hostname = "0.4"

[dev-dependencies]
tempfile = "3"
