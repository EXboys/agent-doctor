name: Copy mobile OSS secrets

# 一次性把 OSS 密钥写到手机仓库，供 Android APK 打包流程自己发布。用完即删。

on:
  workflow_dispatch:

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy OSS secrets to agent-doctor-mobile
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_ADMIN }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$OSS_ACCESS_KEY_ID"
          test -n "$OSS_ACCESS_KEY_SECRET"
          test -n "$OSS_BUCKET"
          test -n "$OSS_ENDPOINT"
          repo="EXboys/agent-doctor-mobile"
          printf '%s' "$OSS_ACCESS_KEY_ID" | gh secret set OSS_ACCESS_KEY_ID --repo "$repo"
          printf '%s' "$OSS_ACCESS_KEY_SECRET" | gh secret set OSS_ACCESS_KEY_SECRET --repo "$repo"
          printf '%s' "$OSS_BUCKET" | gh secret set OSS_BUCKET --repo "$repo"
          printf '%s' "$OSS_ENDPOINT" | gh secret set OSS_ENDPOINT --repo "$repo"
