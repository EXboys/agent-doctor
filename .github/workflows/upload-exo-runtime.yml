name: Upload exo runtime to OSS

# Mirrors the managed exo darwin-arm64 tarball (optional dashboard-zh inside)
# to Alibaba Cloud OSS for mainland downloads.
#
# Source: a GitHub Release asset named exo-darwin-arm64.tar.gz
# Destination: oss://$OSS_BUCKET/runtimes/exo/<version>/exo-darwin-arm64.tar.gz

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag that holds the tarball"
        required: true
        type: string
        default: "exo-runtime-1.0.71"
      version:
        description: "Pinned exo version directory under runtimes/exo/"
        required: true
        type: string
        default: "1.0.71"

permissions:
  contents: read

jobs:
  upload:
    name: Upload exo tarball to China OSS
    runs-on: ubuntu-latest
    steps:
      - name: Download tarball from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p pack
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'exo-darwin-arm64.tar.gz*' --dir pack
          ls -lh pack
          test -f pack/exo-darwin-arm64.tar.gz

      - name: Prepare ossutil
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${OSS_ACCESS_KEY_ID:-}" ] || [ -z "${OSS_ACCESS_KEY_SECRET:-}" ] || [ -z "${OSS_BUCKET:-}" ] || [ -z "${OSS_ENDPOINT:-}" ]; then
            echo "::error::OSS secrets missing"
            exit 1
          fi
          curl -fsSL -o ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/current/ossutil-linux-amd64.zip"
          unzip -qo ossutil.zip -d ossutil-bin
          OSSUTIL="$(find ossutil-bin -type f -name 'ossutil*' ! -name '*.zip' | head -n 1)"
          chmod +x "$OSSUTIL"
          "$OSSUTIL" config \
            -e "${OSS_ENDPOINT}" \
            -i "${OSS_ACCESS_KEY_ID}" \
            -k "${OSS_ACCESS_KEY_SECRET}" \
            -L CH \
            --config-file .ossutilconfig
          echo "OSSUTIL=$OSSUTIL" >> "$GITHUB_ENV"

      - name: Upload to runtimes/exo
        env:
          VERSION: ${{ inputs.version }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 1.0.71"
            exit 1
          fi
          dest="oss://${OSS_BUCKET}/runtimes/exo/${VERSION}"
          "$OSSUTIL" cp pack/exo-darwin-arm64.tar.gz \
            "${dest}/exo-darwin-arm64.tar.gz" \
            -f --config-file .ossutilconfig
          "$OSSUTIL" set-acl "${dest}/exo-darwin-arm64.tar.gz" public-read \
            -f --config-file .ossutilconfig || true
          if [ -f pack/exo-darwin-arm64.tar.gz.sha256 ]; then
            "$OSSUTIL" cp pack/exo-darwin-arm64.tar.gz.sha256 \
              "${dest}/exo-darwin-arm64.tar.gz.sha256" \
              -f --config-file .ossutilconfig
            "$OSSUTIL" set-acl "${dest}/exo-darwin-arm64.tar.gz.sha256" public-read \
              -f --config-file .ossutilconfig || true
          fi
          echo "Uploaded ${dest}/exo-darwin-arm64.tar.gz"
          curl -sI "https://agent-doctor.oss-cn-shenzhen.aliyuncs.com/runtimes/exo/${VERSION}/exo-darwin-arm64.tar.gz" | head -10
