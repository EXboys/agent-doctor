name: Sync updater latest.json to OSS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag that already has latest.json / latest.team.json"
        required: true
        default: "v0.1.40"
      edition:
        description: "personal → desktop/; team → desktop-team/"
        required: true
        default: "personal"
        type: choice
        options:
          - personal
          - team

permissions:
  contents: read

jobs:
  sync:
    name: Upload latest.json to China OSS (${{ inputs.edition }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve edition
        id: edition
        run: |
          eval "$(bash desktop/scripts/edition-meta.sh "${{ inputs.edition }}")"
          echo "oss_prefix=$OSS_PREFIX" >> "$GITHUB_OUTPUT"
          echo "latest_json=$LATEST_JSON" >> "$GITHUB_OUTPUT"

      - name: Download updater JSON from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          LATEST="${{ steps.edition.outputs.latest_json }}"
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${LATEST}" \
            --dir ./oss-sync
          test -f "oss-sync/${LATEST}"

      - name: Upload to Aliyun OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${OSS_ACCESS_KEY_ID:-}" ] || [ -z "${OSS_ACCESS_KEY_SECRET:-}" ] || [ -z "${OSS_BUCKET:-}" ] || [ -z "${OSS_ENDPOINT:-}" ]; then
            echo "::error::OSS secrets missing"
            exit 1
          fi
          PREFIX="${{ steps.edition.outputs.oss_prefix }}"
          LATEST="${{ steps.edition.outputs.latest_json }}"
          curl -fsSL -o ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/current/ossutil-linux-amd64.zip"
          unzip -qo ossutil.zip -d ossutil-bin
          OSSUTIL="$(find ossutil-bin -type f -name 'ossutil*' ! -name '*.zip' | head -n 1)"
          chmod +x "$OSSUTIL"
          "$OSSUTIL" config \
            -e "${OSS_ENDPOINT}" \
            -i "${OSS_ACCESS_KEY_ID}" \
            -k "${OSS_ACCESS_KEY_SECRET}" \
            -L CH \
            --config-file .ossutilconfig
          "$OSSUTIL" cp "oss-sync/${LATEST}" \
            "oss://${OSS_BUCKET}/${PREFIX}/latest.json" \
            -f --config-file .ossutilconfig
          echo "Updated oss://${OSS_BUCKET}/${PREFIX}/latest.json"
