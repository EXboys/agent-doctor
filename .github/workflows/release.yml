name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli:
    name: CLI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            archive: tar.gz
            bin: agent-doctor
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            archive: tar.gz
            bin: agent-doctor
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            archive: tar.gz
            bin: agent-doctor
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            archive: zip
            bin: agent-doctor.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p agent-doctor --target ${{ matrix.target }}

      - name: Package CLI (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="agent-doctor-${VERSION}-${{ matrix.name }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          tar -C dist -czf "${OUT}.tar.gz" "${{ matrix.bin }}"

      - name: Package CLI (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $out = "agent-doctor-$version-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          Compress-Archive -Path "dist/${{ matrix.bin }}" -DestinationPath "$out.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: |
            agent-doctor-*.tar.gz
            agent-doctor-*.zip

  attach-cli:
    name: Attach CLI assets
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: cli-artifacts
          pattern: cli-*
          merge-multiple: true

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(cat <<EOF
          ## Downloads

          ### CLI
          Use [GitHub CLI](https://cli.github.com/) to download the binary for your platform:

          \`\`\`bash
          gh release download ${GITHUB_REF_NAME} --repo ${GITHUB_REPOSITORY} --pattern 'agent-doctor-*'
          \`\`\`

          See [docs/install.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/install.md) for install examples.

          ### Desktop
          Platform installers and bundles are attached below (\`.dmg\`, \`.msi\`, \`.AppImage\`, etc.).
          EOF
          )
          # Strip leading indentation from the heredoc.
          NOTES=$(printf '%s\n' "$NOTES" | sed -e 's/^          //')
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" || \
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Agent Doctor ${GITHUB_REF_NAME}" \
            --notes "$NOTES"

      - name: Upload CLI archives to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" cli-artifacts/* --repo "${GITHUB_REPOSITORY}" --clobber

  # Desktop build follows SkillLite: sign during build, notarize separately with notarytool
  # (do not pass APPLE_ID / APPLE_API_* into tauri build — that triggers built-in notarization).
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install create-dmg (macOS DMG bundling)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop

      # macOS: import Developer ID cert for signing (skip if secrets missing).
      # Do not use secrets in `if:` — check inside the script.
      - name: Import Apple Developer certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE not set, skipping signing"
            exit 0
          fi
          if [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::APPLE_CERTIFICATE_PASSWORD is empty"
            exit 1
          fi
          if [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::KEYCHAIN_PASSWORD is empty"
            exit 1
          fi

          # macOS base64 accepts -D / --decode; prefer -D for BSD compatibility.
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > certificate.p12
          if [ ! -s certificate.p12 ]; then
            echo "::error::Decoded certificate.p12 is empty (check APPLE_CERTIFICATE base64)"
            exit 1
          fi
          echo "Decoded certificate.p12 size: $(wc -c < certificate.p12) bytes"

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Do not swallow import errors — wrong password is the usual failure mode.
          if ! security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -A
          then
            echo "::error::security import failed (wrong APPLE_CERTIFICATE_PASSWORD, or p12 missing private key)"
            rm -f certificate.p12
            exit 1
          fi
          rm -f certificate.p12

          # With -A on import, codesign can use the key even if partition-list fails
          # (common flake on GitHub macos runners with custom KEYCHAIN_PASSWORD).
          if ! security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain; then
            echo "::warning::set-key-partition-list failed; continuing because import used -A"
          fi
          security find-identity -v -p codesigning build.keychain | sed 's/"[^"]*"/"[redacted]"/g' || true

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found after importing APPLE_CERTIFICATE."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity configured (identity not logged)."

      - name: Build Tauri app
        working-directory: desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # App only; notarize + DMG in later steps (SkillLite pattern).
            npm run tauri -- build --bundles app
          else
            npm run tauri -- build
          fi
        env:
          CI: true
          # Sign only — do not inject APPLE_ID / APPLE_API_* or Tauri will notarize inline.
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify .app bundle exists (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_DIR="desktop/src-tauri/target/release/bundle/macos"
          echo "--- Contents of bundle/macos/ ---"
          ls -la "$APP_DIR" || echo "WARNING: $APP_DIR does not exist"
          ls -la "$APP_DIR/Agent Doctor.app/Contents/" 2>/dev/null || echo "WARNING: .app not found"

      # API Key (.p8) or Apple ID + app-specific password + Team ID.
      # Failure does not fail the job (signed-only .app / DMG may still ship).
      - name: Notarize macOS app (best effort)
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          REPO="${{ github.workspace }}"
          KEY_PATH="$REPO/desktop/authkey.p8"
          APP_PATH="$REPO/desktop/src-tauri/target/release/bundle/macos/Agent Doctor.app"
          ZIP_PATH=""
          cleanup() {
            rm -f "$KEY_PATH"
            if [ -n "${ZIP_PATH}" ] && [ -f "${ZIP_PATH}" ]; then rm -f "${ZIP_PATH}"; fi
          }
          trap cleanup EXIT

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app not found at $APP_PATH"
            exit 1
          fi

          ZIP_PATH="$(mktemp "${RUNNER_TEMP:-/tmp}/agent-doctor-notarize.XXXXXX")"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          submit_ok=0
          if [ -n "${APPLE_API_KEY_P8:-}" ] && [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            if xcrun notarytool submit "$ZIP_PATH" \
              --key "$KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait; then
              submit_ok=1
            fi
            rm -f "$KEY_PATH"
          elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            if xcrun notarytool submit "$ZIP_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait; then
              submit_ok=1
            fi
          else
            echo "Notarization credentials incomplete (API key trio or APPLE_ID+APPLE_PASSWORD+APPLE_TEAM_ID), skipping."
            exit 0
          fi

          if [ "$submit_ok" -ne 1 ]; then
            echo "::warning::Notarization failed. Continuing with signed-only app (no stapler)."
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"
          echo "Notarization and stapling completed."

      - name: Create DMG with create-dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_VERSION=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          APP_PATH="desktop/src-tauri/target/release/bundle/macos/Agent Doctor.app"
          DMG_DIR="desktop/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          set +e
          create-dmg \
            --volname "Agent Doctor" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Agent Doctor.app" 175 190 \
            --app-drop-link 425 190 \
            "$DMG_DIR/Agent.Doctor_${APP_VERSION}_aarch64.dmg" \
            "$APP_PATH"
          EXIT_CODE=$?
          set -e
          # create-dmg exits 2 when Finder assistance fails but DMG is often still usable.
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 2 ]; then
            echo "create-dmg failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Remove Apple API key file (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: rm -f authkey.p8

      - name: Upload macOS artifact (dmg)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: agent-doctor-desktop-darwin-arm64
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: agent-doctor-desktop-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: agent-doctor-desktop-linux-x64
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm

  upload-desktop-to-release:
    name: Upload desktop assets to Release
    needs: build-desktop
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/') && !cancelled()
    permissions:
      contents: write

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./desktop-artifacts
          pattern: agent-doctor-desktop-*
          merge-multiple: false

      - name: List artifacts
        run: find ./desktop-artifacts -type f

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" || \
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Agent Doctor ${GITHUB_REF_NAME}" \
            --notes "Release assets are uploading."

      - name: Upload desktop files to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            desktop-artifacts/agent-doctor-desktop-darwin-arm64/*
            desktop-artifacts/agent-doctor-desktop-windows-x64/*
            desktop-artifacts/agent-doctor-desktop-linux-x64/*
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No desktop artifacts to upload."
            exit 0
          fi
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
