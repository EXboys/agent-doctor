name: Ensure OSS edition prefix

# Creates/updates a public-readable placeholder under desktop/ or desktop-team/
# so the updater CDN prefix exists before the first team release.
on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Which CDN prefix to ensure"
        required: true
        default: "team"
        type: choice
        options:
          - personal
          - team

permissions:
  contents: read

jobs:
  ensure:
    name: Ensure OSS prefix (${{ inputs.edition }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve edition
        id: edition
        run: |
          eval "$(bash desktop/scripts/edition-meta.sh "${{ inputs.edition }}")"
          echo "oss_prefix=$OSS_PREFIX" >> "$GITHUB_OUTPUT"
          echo "product_name=$PRODUCT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload placeholder to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${OSS_ACCESS_KEY_ID:-}" ] || [ -z "${OSS_ACCESS_KEY_SECRET:-}" ] || [ -z "${OSS_BUCKET:-}" ] || [ -z "${OSS_ENDPOINT:-}" ]; then
            echo "::error::OSS secrets missing (OSS_ACCESS_KEY_ID / SECRET / BUCKET / ENDPOINT)"
            exit 1
          fi
          PREFIX="${{ steps.edition.outputs.oss_prefix }}"
          PRODUCT="${{ steps.edition.outputs.product_name }}"
          mkdir -p oss-seed
          cat > oss-seed/README.txt <<EOF
          Agent Doctor updater channel: ${PREFIX}/
          Product: ${PRODUCT}
          Created by ensure-oss-edition-prefix workflow.
          Clients fetch ${PREFIX}/latest.json after a signed release.
          EOF
          # Strip leading indent from heredoc.
          sed -i 's/^          //' oss-seed/README.txt

          curl -fsSL -o ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/current/ossutil-linux-amd64.zip"
          unzip -qo ossutil.zip -d ossutil-bin
          OSSUTIL="$(find ossutil-bin -type f -name 'ossutil*' ! -name '*.zip' | head -n 1)"
          chmod +x "$OSSUTIL"
          "$OSSUTIL" config \
            -e "${OSS_ENDPOINT}" \
            -i "${OSS_ACCESS_KEY_ID}" \
            -k "${OSS_ACCESS_KEY_SECRET}" \
            -L CH \
            --config-file .ossutilconfig

          "$OSSUTIL" cp oss-seed/README.txt \
            "oss://${OSS_BUCKET}/${PREFIX}/README.txt" \
            -f --config-file .ossutilconfig

          # Make the object publicly readable (matches personal desktop/ channel).
          "$OSSUTIL" set-acl "oss://${OSS_BUCKET}/${PREFIX}/README.txt" public-read \
            -f --config-file .ossutilconfig || \
            echo "::warning::set-acl failed — ensure bucket/prefix policy allows public-read for updater JSON"

          echo "Ensured oss://${OSS_BUCKET}/${PREFIX}/"
          "$OSSUTIL" ls "oss://${OSS_BUCKET}/${PREFIX}/" --config-file .ossutilconfig || true
