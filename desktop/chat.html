<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Doctor — Ask</title>
    <link rel="stylesheet" href="/src/chat.css" />
  </head>
  <body>
    <div class="chat-shell" id="chat-shell">
      <aside id="chat-resources-panel" class="chat-resources-panel" aria-hidden="true">
        <div class="chat-resources-panel-inner">
          <div class="chat-resources-panel-head">
            <strong data-i18n="chat.resourcesPanelTitle">Resources</strong>
            <div class="chat-resources-actions">
              <button id="chat-resources-refresh" type="button" class="btn-link" data-i18n="chat.resourcesRefresh">刷新</button>
              <button id="chat-open-resources" type="button" class="btn-link" data-i18n="chat.openResources">管理</button>
            </div>
          </div>
          <div class="chat-workspace-block">
            <label class="chat-workspace-label" for="chat-workspace-select" data-i18n="ask.workspaceSwitch">工作区</label>
            <div class="chat-workspace-row">
              <select id="chat-workspace-select" class="chat-workspace-select" aria-label="Workspace"></select>
              <button id="chat-workspace-activate" type="button" class="btn-secondary btn-compact" data-i18n="ask.workspaceActivate">激活</button>
            </div>
            <p id="chat-cwd" class="chat-cwd" title="">—</p>
            <p id="chat-workspace-hint" class="chat-workspace-hint" data-i18n="ask.workspaceHint"></p>
          </div>
          <section class="chat-resources-section">
            <h3 data-i18n="chat.skillsTitle">Skills</h3>
            <div id="chat-skills-list" class="chat-chip-list" role="list"></div>
            <p id="chat-skills-empty" class="chat-resources-empty" hidden data-i18n="chat.skillsEmpty">当前 runtime 暂无已挂载 skill</p>
          </section>
          <section class="chat-resources-section">
            <h3 data-i18n="chat.mcpTitle">MCP</h3>
            <div id="chat-mcp-list" class="chat-chip-list" role="list"></div>
            <p id="chat-mcp-empty" class="chat-resources-empty" hidden data-i18n="chat.mcpEmpty">当前 runtime 暂无 MCP</p>
          </section>
          <p class="chat-resources-hint" data-i18n="chat.resourcesHint">点击加入本轮优先；完整 CLI 用「打开终端」。</p>
        </div>
      </aside>

      <aside class="chat-side">
        <div class="chat-brand">
          <div class="chat-brand-mark" aria-hidden="true">AD</div>
          <div>
            <p class="chat-brand-name">Agent Doctor</p>
            <p class="chat-brand-sub" data-i18n="chat.subtitle">应用内问答</p>
          </div>
        </div>

        <button id="chat-new" type="button" class="btn-side btn-new" data-i18n="chat.newSession">新建会话</button>
        <div class="chat-session-block">
          <p class="chat-session-label" data-i18n="chat.sessions">会话记录</p>
          <div id="chat-sessions" class="chat-sessions" role="list"></div>
        </div>

        <button
          id="chat-resources-toggle"
          type="button"
          class="chat-resources-toggle"
          aria-expanded="false"
          aria-controls="chat-resources-panel"
        >
          <span class="chat-resources-toggle-title" data-i18n="chat.resourcesPanelTitle">Resources</span>
          <span id="chat-resources-label" class="chat-resources-label">—</span>
        </button>

        <label class="chat-elevated">
          <input id="chat-elevated" type="checkbox" />
          <span id="chat-elevated-label" data-i18n="chat.elevatedClaude">跳过权限确认</span>
        </label>
        <p class="chat-permission-hint" data-i18n="chat.permissionHint">未跳过/未全自动时，工具调用会在对话里弹出「允许 / 拒绝」（Claude 与 Codex）。</p>

        <div class="chat-side-actions">
          <button id="chat-terminal" type="button" class="btn-side" data-i18n="chat.terminal">打开终端</button>
          <button id="chat-clear" type="button" class="btn-side btn-side-muted" data-i18n="chat.clear">清空当前</button>
        </div>

        <p id="chat-status" class="chat-status" aria-live="polite"></p>
        <p class="chat-footnote" data-i18n="chat.footnote">默认贴屏幕右侧 · 完整交互请用终端</p>
      </aside>

      <main class="chat-main">
        <header class="chat-top">
          <h1 id="chat-title" class="chat-title">对话</h1>
          <button id="chat-close" type="button" class="chat-close" data-i18n="chat.close" title="关闭">关闭</button>
        </header>

        <div id="chat-log" class="chat-log" aria-live="polite"></div>

        <footer class="chat-composer">
          <div id="chat-mentions" class="chat-mentions" hidden></div>
          <div id="chat-attachments" class="chat-attachments" hidden></div>
          <div class="chat-composer-box">
            <div class="chat-prompt-wrap">
              <textarea
                id="chat-prompt"
                class="chat-prompt"
                rows="1"
                placeholder="在当前工作区问一句… 可用 @skill: / @mcp:"
                spellcheck="false"
              ></textarea>
              <div id="chat-mention-menu" class="chat-mention-menu" hidden role="listbox"></div>
            </div>
            <div class="chat-composer-bar">
              <button
                id="chat-attach"
                type="button"
                class="btn-composer-icon"
                data-i18n-title="chat.attach"
                aria-label="上传文件或图片"
                title="上传文件或图片"
              >
                <span aria-hidden="true">+</span>
              </button>
              <button id="chat-action" type="button" class="btn-primary btn-send" data-i18n="chat.send">发送</button>
            </div>
          </div>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/chat.ts"></script>
  </body>
</html>
