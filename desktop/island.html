<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Agent Doctor</title>
    <link rel="stylesheet" href="/src/island.css" />
  </head>
  <body>
    <div id="island" class="island" hidden>
      <div class="island-pill">
        <span class="island-mark" aria-hidden="true"></span>
        <span id="island-title" class="island-title"></span>
      </div>
      <label
        class="island-idle"
        for="island-hide"
        data-i18n-title="island.hideIdleHint"
        title="打开后，没有对话在进行时，顶部黑条会消失。"
      >
        <span data-i18n="island.hideIdle">空闲时收起</span>
        <input id="island-hide" class="island-switch" type="checkbox" role="switch" />
      </label>
      <div class="island-body">
        <div class="island-read-frame">
          <div id="island-detail" class="island-read" hidden></div>
          <button id="island-scroll-hint" class="island-scroll-hint" type="button" data-i18n="island.scrollMore" hidden>下滑看更多</button>
        </div>
        <div id="island-actions" class="island-actions"></div>
        <p id="island-error" class="island-error" hidden></p>
      </div>
    </div>
    <script type="module" src="/src/island/page.ts"></script>
  </body>
</html>
