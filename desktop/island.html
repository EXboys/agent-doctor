<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Agent Doctor</title>
    <script>
      if (/\bWindows\b/.test(navigator.userAgent)) document.documentElement.dataset.os = "windows";
    </script>
    <link rel="stylesheet" href="/src/island.css" />
  </head>
  <body>
    <div id="island" class="island" hidden>
      <div class="island-pill">
        <span class="island-mark" aria-hidden="true"></span>
        <span id="island-title" class="island-title"></span>
      </div>
      <button
        id="island-screenshot"
        class="island-shot"
        type="button"
        data-i18n-title="island.screenshotHint"
        title="截取当前屏幕内容发到对话里分析"
      >
        <svg class="island-shot-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M9.35 4.5c.28 0 .54.15.68.4l.72 1.28h3.5l.72-1.28a.78.78 0 0 1 .68-.4h1.12c1.24 0 2.25 1 2.25 2.25v9.5c0 1.24-1 2.25-2.25 2.25H7.25C6 18.5 5 17.5 5 16.25v-9.5C5 5.5 6 4.5 7.25 4.5h2.1ZM12 8.6a4.15 4.15 0 1 0 0 8.3 4.15 4.15 0 0 0 0-8.3Zm0 1.7a2.45 2.45 0 1 1 0 4.9 2.45 2.45 0 0 1 0-4.9Z"
          />
        </svg>
        <span data-i18n="island.screenshot">截屏提问</span>
      </button>
      <label
        class="island-idle"
        for="island-hide"
        data-i18n-title="island.hideIdleHint"
        title="打开后，没有对话在进行时，顶部黑条会消失。"
      >
        <span data-i18n="island.hideIdle">空闲时隐藏</span>
        <input id="island-hide" class="island-switch" type="checkbox" role="switch" />
      </label>
      <button id="island-back" class="island-back" type="button" hidden>
        <svg class="island-back-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M10 3.5 5.5 8 10 12.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span data-i18n="island.backToList">返回</span>
      </button>
      <div class="island-body">
        <div id="island-shot-card" class="island-shot-card" hidden></div>
        <div class="island-read-frame">
          <div id="island-detail" class="island-read" hidden></div>
          <button id="island-scroll-hint" class="island-scroll-hint" type="button" data-i18n="island.scrollMore" hidden>下滑看更多</button>
        </div>
        <div id="island-actions" class="island-actions"></div>
        <p id="island-error" class="island-error" hidden></p>
      </div>
    </div>
    <script type="module" src="/src/island/page.ts"></script>
  </body>
</html>
