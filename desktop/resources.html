<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Doctor — Resources</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/resources.css" />
  </head>
  <body class="resources-page">
    <div class="resources-shell">
      <header class="resources-top">
        <div>
          <h1 data-i18n="resources.windowTitle">Skills / MCP</h1>
          <p id="resources-subtitle" class="resources-subtitle">—</p>
        </div>
        <div class="resources-top-actions">
          <button id="resources-refresh-all" type="button" class="btn-secondary btn-compact" data-i18n="resources.refresh">刷新</button>
          <button id="resources-close" type="button" class="btn-ghost btn-compact" data-i18n="chat.close">关闭</button>
        </div>
      </header>

      <div class="resources-nav-row">
        <nav class="resources-section-tabs" id="resources-section-tabs" role="tablist">
          <button type="button" class="resources-section-tab" data-section="agents" role="tab" aria-selected="false">
            <svg class="resources-section-tab-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M5.5 19c1.2-3 3.6-4.5 6.5-4.5S17.8 16 19 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span data-i18n="resources.tabAgents">Agent</span>
          </button>
          <button type="button" class="resources-section-tab is-active" data-section="skills" role="tab" aria-selected="true">
            <svg class="resources-section-tab-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3l2.2 4.5L19 8.2l-3.5 3.4.8 4.9L12 14.8 7.7 16.5l.8-4.9L5 8.2l4.8-.7L12 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="resources.tabSkills">技能</span>
          </button>
          <button type="button" class="resources-section-tab" data-section="tools" role="tab" aria-selected="false">
            <svg class="resources-section-tab-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.2 2.2-2.8-2.8 2-2.1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="resources.tabTools">工具</span>
          </button>
          <button type="button" class="resources-section-tab" data-section="browser" role="tab" aria-selected="false">
            <svg class="resources-section-tab-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
              <path d="M3.5 9h17M8 4.5v4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span data-i18n="resources.tabBrowser">浏览器</span>
          </button>
        </nav>
        <label class="resources-search">
          <span aria-hidden="true">⌕</span>
          <input id="resources-search" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="resources.searchGlobal" placeholder="搜索技能或工具…" />
        </label>
      </div>

      <main class="resources-body">
        <section class="resources-panel" id="panel-agents" data-section-panel="agents" hidden>
          <p class="section-hint" id="resources-agents-hint" data-i18n="resources.agentCatalogHint">点安装。装好后会出现在首页。</p>
          <ul id="resources-agents-list" class="res-catalog-list" aria-live="polite"></ul>
          <p id="resources-agents-empty" class="section-hint" hidden data-i18n="resources.emptyAgents">都能用的都已经装上了。回首页就能检查。</p>
        </section>
        <section class="resources-panel is-active" id="panel-skills" data-section-panel="skills">
          <div class="resources-skills-sticky" id="resources-skills-sticky">
            <div
              class="resources-skills-nav filters filters-scroll"
              id="resources-skill-filters"
              role="group"
              aria-label="Skill filters"
            ></div>
            <div class="resources-agent-bar" id="resources-agent-bar" hidden>
              <div class="resources-agent-nav">
                <div
                  class="resources-agent-chips filters-scroll"
                  id="resources-agent-filters"
                  role="group"
                  aria-label="Agent filters"
                ></div>
              </div>
              <p class="resources-agent-hint" id="resources-agent-hint" hidden></p>
            </div>
            <div class="resources-mall-account" id="resources-mall-account" hidden>
              <p id="resources-mall-account-status" class="resources-mall-account-status">—</p>
              <div class="resources-mall-account-actions">
                <button id="resources-mall-login" type="button" class="btn-primary btn-compact" data-i18n="resources.mallLogin">登录 TeamUps</button>
                <button id="resources-mall-logout" type="button" class="btn-ghost btn-compact" hidden data-i18n="resources.mallLogout">退出登录</button>
              </div>
            </div>
          </div>
          <div id="resources-list" class="res-catalog-list" aria-live="polite"></div>
          <p id="resources-empty" class="section-hint" hidden data-i18n="resources.emptySkills">还没有技能</p>
          <p id="resources-footnote" class="section-footnote"></p>
        </section>

        <section class="resources-panel" id="panel-tools" data-section-panel="tools" hidden>
          <div class="resources-toolbar">
            <div class="filters" id="resources-tool-filters" role="group" aria-label="Tool filters">
              <button type="button" class="filter-chip is-active" data-tool-filter="all" data-i18n="resources.filterAll">全部</button>
              <button type="button" class="filter-chip" data-tool-filter="issue" data-i18n="resources.filterIssue">问题</button>
            </div>
          </div>
          <ul id="resources-tools-list" class="res-catalog-list" aria-live="polite"></ul>
          <p id="resources-tools-empty" class="section-hint" hidden data-i18n="resources.emptyTools">还没有工具</p>
        </section>

        <section class="resources-panel" id="panel-browser" data-section-panel="browser" hidden>
          <div class="section-label">
            <h2 data-i18n="mcp.browserTitle">浏览器</h2>
            <span id="mcp-browser-badge" class="badge muted">—</span>
          </div>
          <div class="meta-grid" id="mcp-browser-meta">
            <div class="meta-row"><span class="meta-label" data-i18n="mcp.chrome">Chrome</span><span class="meta-value" id="mcp-chrome">—</span></div>
            <div class="meta-row"><span class="meta-label" data-i18n="mcp.cdp">CDP</span><span class="meta-value" id="mcp-cdp">—</span></div>
            <div class="meta-row"><span class="meta-label" data-i18n="mcp.configured">已配置</span><span class="meta-value" id="mcp-configured">—</span></div>
            <div class="meta-row"><span class="meta-label" data-i18n="mcp.binary">CLI</span><span class="meta-value" id="mcp-binary">—</span></div>
          </div>
          <label class="mcp-option" for="mcp-show-ui">
            <input id="mcp-show-ui" type="checkbox" checked />
            <span data-i18n="mcp.showUi">显示浏览器窗口</span>
          </label>
          <div class="mcp-profile">
            <div class="mcp-profile-actions">
              <button id="mcp-profile-isolated" type="button" class="btn-secondary btn-compact" data-i18n="mcp.profileIsolated" data-i18n-title="mcp.profileIsolatedTitle">独立（推荐）</button>
              <button id="mcp-profile-system" type="button" class="btn-secondary btn-compact" data-i18n="mcp.profileSystem" data-i18n-title="mcp.profileSystemTitle">日常登录</button>
            </div>
            <details class="mcp-advanced">
              <summary data-i18n="mcp.advanced">高级</summary>
              <label class="mcp-profile-label" for="mcp-user-data-dir" data-i18n="mcp.profile">用户目录</label>
              <input id="mcp-user-data-dir" type="text" class="mcp-profile-input" spellcheck="false" autocomplete="off" />
              <label class="mcp-profile-label" for="mcp-profile-directory" data-i18n="mcp.profileDirectory">账号目录</label>
              <input id="mcp-profile-directory" type="text" class="mcp-profile-input" spellcheck="false" autocomplete="off" placeholder="Default" />
            </details>
          </div>
          <div class="runtime-actions mcp-actions">
            <button id="mcp-refresh" type="button" class="btn-secondary btn-compact" data-i18n="mcp.refresh">刷新</button>
            <button id="mcp-diagnose-wire" type="button" class="btn-primary btn-compact" data-i18n="mcp.diagnoseWire">诊断并写入</button>
          </div>
          <ul id="mcp-targets" class="mcp-targets" aria-live="polite"></ul>
          <details class="mcp-snippet">
            <summary data-i18n="mcp.snippetTitle">配置片段</summary>
            <pre id="mcp-snippet" class="mcp-snippet-code"></pre>
          </details>
          <p id="mcp-footnote" class="section-footnote"></p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/resources.ts"></script>
  </body>
</html>
