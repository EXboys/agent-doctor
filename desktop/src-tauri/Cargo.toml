[package]
name = "agent-doctor-desktop"
description = "Agent Doctor menubar companion"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "agent_doctor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-doctor-core.workspace = true
agent-doctor-mcp.workspace = true
agent-doctor-ocr.workspace = true
agent-doctor-voice.workspace = true
anyhow.workspace = true
calamine = "0.26"
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
zip = "2.2"

# `tauri dev` runs with `--no-default-features` (loads http://127.0.0.1:1420).
# `tauri build` / normal cargo builds enable this so frontendDist is embedded —
# without it the app always white-screens unless Vite is running.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSWindow", "NSPanel", "NSResponder", "NSScreen", "NSView"] }
