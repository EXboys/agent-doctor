[package]
name = "agent-doctor-desktop"
description = "Agent Doctor menubar companion"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "agent_doctor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-doctor-core.workspace = true
agent-doctor-mcp.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# `tauri dev` runs with `--no-default-features` (loads http://127.0.0.1:1420).
# `tauri build` / normal cargo builds enable this so frontendDist is embedded —
# without it the app always white-screens unless Vite is running.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
