[package]
name = "agent-doctor-desktop"
description = "Agent Doctor menubar companion"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "agent_doctor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-doctor-core.workspace = true
agent-doctor-mcp.workspace = true
agent-doctor-ocr.workspace = true
agent-doctor-prompt.workspace = true
agent-doctor-voice.workspace = true
anyhow.workspace = true
base64 = "0.22"
calamine = "0.26"
dirs.workspace = true
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "time", "net"] }
serde.workspace = true
serde_json.workspace = true
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tungstenite = { workspace = true }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
zip = "2.2"

# `tauri dev` runs with `--no-default-features` (loads http://127.0.0.1:1420).
# `tauri build` / normal cargo builds enable this so frontendDist is embedded —
# without it the app always white-screens unless Vite is running.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.12"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSWindow", "NSPanel", "NSResponder", "NSScreen", "NSView"] }
