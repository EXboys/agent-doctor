<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Doctor</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="widget">
      <header class="widget-toolbar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3L4 7.5V16.5L12 21L20 16.5V7.5L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M12 12L4 7.5M12 12L20 7.5M12 12V21" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
          </div>
          <p class="brand-name" data-i18n="app.eyebrow">Agent Doctor</p>
        </div>
        <div class="toolbar-actions">
          <div class="mode-switch" id="mode-banner" role="group" aria-label="LLM mode">
            <button id="mode-use-personal" type="button" class="mode-switch-btn" data-mode="personal" data-i18n="mode.personal">个人</button>
            <button id="mode-use-team" type="button" class="mode-switch-btn" data-mode="team" data-i18n="mode.team">团队</button>
          </div>
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn" data-lang="zh" data-i18n="lang.zh">中</button>
            <button type="button" class="lang-btn" data-lang="en" data-i18n="lang.en">EN</button>
          </div>
          <button id="refresh" type="button" class="btn-scan" title="Run doctor">
            <span class="btn-scan-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 4V9H4.58152M19.9381 11C19.446 7.05369 16.0796 4 12 4C8.64262 4 5.76829 6.06817 4.58152 9M4.58152 9H9M20 20V15H19.4185M19.4185 15C18.2317 17.9318 15.3574 20 12 20C7.92038 20 4.55399 16.9463 4.06189 13M19.4185 15H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="btn-label" data-i18n="doctor.run">扫描</span>
            <span class="spinner" hidden aria-hidden="true"></span>
          </button>
        </div>
        <p id="mode-meta" class="sr-only" aria-live="polite"></p>
        <p id="mode-hint" class="sr-only" aria-live="polite" hidden></p>
      </header>

      <section class="status-bar" id="health-strip" aria-live="polite">
        <div class="health-pill" id="health-pill">
          <span class="health-dot" id="health-dot" aria-hidden="true"></span>
          <span class="health-label" id="health-label" data-i18n="health.ready">就绪</span>
        </div>
        <div class="status-meta">
          <span><span data-i18n="summary.installed">已装</span> <strong id="installed-count">—</strong></span>
          <span class="status-sep" aria-hidden="true">·</span>
          <span><span data-i18n="summary.preset">预设</span> <strong id="profile-status">—</strong></span>
          <span class="status-sep" aria-hidden="true">·</span>
          <span><strong id="last-scan" class="stat-chip-value-sm">—</strong></span>
        </div>
      </section>

      <nav class="main-tabs" id="main-tabs" role="tablist" aria-label="Main sections">
        <button type="button" class="main-tab is-active" role="tab" aria-selected="true" data-main-tab="diagnose" data-i18n="nav.diagnose">诊断</button>
        <button type="button" class="main-tab" role="tab" aria-selected="false" data-main-tab="provider" data-i18n="nav.provider">Provider</button>
        <button type="button" class="main-tab" role="tab" aria-selected="false" data-main-tab="workspace" data-i18n="nav.workspace">工作区</button>
      </nav>

      <div class="main-panels">
        <section class="main-panel is-active" id="panel-diagnose" role="tabpanel" data-main-panel="diagnose">
          <section class="widget-section runtime-section">
            <div class="runtime-head">
              <div id="runtime-tabs" class="runtime-tabs" role="tablist" aria-label="Runtimes"></div>
              <span id="runtime-count" class="section-badge">—</span>
            </div>
            <div id="runtimes" class="runtime-panels" aria-live="polite"></div>
          </section>
        </section>

        <section class="main-panel" id="panel-provider" role="tabpanel" data-main-panel="provider" hidden>
          <section class="widget-section personal-section provider-panel is-active" id="personal-section" data-provider-panel="personal">
            <div id="personal-list-view">
              <div class="section-label">
                <span class="section-icon" aria-hidden="true">⬡</span>
                <h2 data-i18n="personal.title">个人 Provider</h2>
                <button id="personal-add" type="button" class="btn-primary btn-compact" data-i18n="personal.add">新增</button>
              </div>
              <p id="personal-status" class="section-hint" data-i18n="personal.loading">正在检查个人配置…</p>
              <div id="personal-connected" class="evotown-connected" hidden>
                <p class="evotown-connected-line"><span data-i18n="personal.configuredUrl">当前</span> <strong id="personal-connected-url">—</strong></p>
                <p class="evotown-connected-meta" id="personal-connected-meta"></p>
              </div>
              <ul id="personal-list" class="provider-list" aria-live="polite"></ul>
              <p id="personal-list-hint" class="section-footnote" data-i18n="personal.footnote">选服务商模板或自定义 URL → 验证 → 写入 runtime。</p>
            </div>

            <div id="personal-form-view" hidden>
              <div class="section-label">
                <button id="personal-back" type="button" class="btn-ghost btn-compact" data-i18n="personal.back">返回</button>
                <h2 id="personal-form-title" data-i18n="personal.formAdd">新增 Provider</h2>
              </div>
              <form id="personal-form" class="evotown-form" autocomplete="off">
                <input id="personal-id" type="hidden" value="" />
                <label class="field-row field-row-inline">
                  <span class="field-label" data-i18n="personal.preset">服务商</span>
                  <select id="personal-preset" class="field-input field-select">
                    <option value="custom" data-i18n="personal.presetCustom">自定义</option>
                    <optgroup label="OpenAI 协议" data-i18n-label="personal.groupOpenAI">
                      <option value="openai">OpenAI</option>
                      <option value="deepseek">DeepSeek (OpenAI)</option>
                      <option value="moonshot">Moonshot / Kimi</option>
                      <option value="siliconflow">SiliconFlow</option>
                      <option value="openrouter">OpenRouter</option>
                      <option value="groq">Groq</option>
                    </optgroup>
                    <optgroup label="Claude 协议" data-i18n-label="personal.groupClaude">
                      <option value="anthropic">Anthropic</option>
                      <option value="deepseek-anthropic">DeepSeek (Claude)</option>
                    </optgroup>
                  </select>
                </label>
                <label class="field-row field-row-inline">
                  <span class="field-label" data-i18n="personal.protocol">协议</span>
                  <select id="personal-protocol" class="field-input field-select">
                    <option value="openai" data-i18n="personal.protocolOpenAI">OpenAI 兼容（Codex / Hermes）</option>
                    <option value="anthropic" data-i18n="personal.protocolAnthropic">Claude / Anthropic（Claude Code）</option>
                  </select>
                </label>
                <label class="field-row field-row-inline" id="personal-name-row">
                  <span class="field-label" data-i18n="personal.name">名称</span>
                  <input id="personal-name" class="field-input" type="text" placeholder="My Provider" />
                </label>
                <label class="field-row field-row-inline">
                  <span class="field-label" data-i18n="personal.url">API Base URL</span>
                  <input id="personal-url" class="field-input" type="url" placeholder="https://api.openai.com/v1" />
                </label>
                <label class="field-row field-row-inline">
                  <span class="field-label" data-i18n="personal.apiKey">API Key</span>
                  <input id="personal-key" class="field-input" type="password" placeholder="sk-…" autocomplete="off" />
                </label>
                <label class="field-row field-row-inline">
                  <span class="field-label" data-i18n="personal.model">模型</span>
                  <input id="personal-model" class="field-input" type="text" list="personal-model-suggestions" placeholder="deepseek-v4-flash" />
                </label>
                <datalist id="personal-model-suggestions"></datalist>
                <div class="evotown-actions">
                  <button id="personal-verify" type="button" class="btn-secondary" data-i18n="personal.verify">验证</button>
                  <button id="personal-save" type="button" class="btn-secondary" data-i18n="personal.save">保存</button>
                  <button id="personal-apply" type="submit" class="btn-primary" data-i18n="personal.apply">保存并切换</button>
                </div>
              </form>
              <p id="personal-hint" class="section-footnote"></p>
            </div>
          </section>

          <section class="widget-section evotown-section provider-panel" id="evotown-section" data-provider-panel="evotown" hidden>
            <div class="section-label">
              <span class="section-icon" aria-hidden="true">⎈</span>
              <h2 data-i18n="evotown.title">Evotown</h2>
            </div>
            <p id="evotown-status" class="section-hint" data-i18n="evotown.loading">正在检查连接…</p>
            <div id="evotown-connected" class="evotown-connected" hidden>
              <p class="evotown-connected-line"><span data-i18n="evotown.connectedUrl">已连接</span> <strong id="evotown-connected-url">—</strong></p>
              <p class="evotown-connected-meta" id="evotown-connected-meta"></p>
            </div>
            <form id="evotown-form" class="evotown-form" autocomplete="off">
              <label class="field-row field-row-inline">
                <span class="field-label" data-i18n="evotown.url">Evotown URL</span>
                <input id="evotown-url" class="field-input" type="url" placeholder="https://evotown.example.com" />
              </label>
              <label class="field-row field-row-inline">
                <span class="field-label" data-i18n="evotown.apiKey">API Key</span>
                <input id="evotown-key" class="field-input" type="password" placeholder="evk_…" autocomplete="off" />
              </label>
              <div class="evotown-actions">
                <button id="evotown-connect" type="submit" class="btn-primary" data-i18n="evotown.connect">连接并同步</button>
                <button id="evotown-resync" type="button" class="btn-secondary" data-i18n="evotown.resync" hidden>重新同步</button>
              </div>
            </form>
            <p id="evotown-hint" class="section-footnote"></p>
          </section>
        </section>

        <section class="main-panel" id="panel-workspace" role="tabpanel" data-main-panel="workspace" hidden>
          <section class="widget-section">
            <div class="section-label">
              <span class="section-icon" aria-hidden="true">◈</span>
              <h2 data-i18n="presets.title">配置预设</h2>
            </div>
            <p id="preset-status" class="section-hint" data-i18n="presets.loading">正在加载预设…</p>
            <div class="preset-row">
              <div class="picker" id="preset-picker">
                <button
                  type="button"
                  class="picker-trigger"
                  id="preset-trigger"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  disabled
                >
                  <span class="picker-leading" aria-hidden="true">◈</span>
                  <span class="picker-value" id="preset-trigger-label">—</span>
                  <span class="picker-chevron" aria-hidden="true">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                </button>
                <div class="picker-menu" id="preset-menu" role="listbox" hidden></div>
              </div>
              <button id="preset-apply" type="button" class="btn-secondary" data-i18n="presets.switch">切换</button>
            </div>
            <p id="preset-hint" class="section-footnote"></p>
          </section>

          <section class="widget-section">
            <div class="section-label">
              <span class="section-icon" aria-hidden="true">▣</span>
              <h2 data-i18n="workspaces.title">Workspaces</h2>
            </div>
            <p id="workspace-status" class="section-hint" data-i18n="workspaces.loading">Loading workspaces…</p>
            <div class="preset-row workspace-actions-row">
              <div class="picker" id="workspace-picker">
                <button
                  type="button"
                  class="picker-trigger"
                  id="workspace-trigger"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  disabled
                >
                  <span class="picker-leading" aria-hidden="true">▣</span>
                  <span class="picker-value" id="workspace-trigger-label">—</span>
                  <span class="picker-chevron" aria-hidden="true">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                </button>
                <div class="picker-menu" id="workspace-menu" role="listbox" hidden></div>
              </div>
              <button id="workspace-apply" type="button" class="btn-secondary" data-i18n="workspaces.switch">Switch</button>
            </div>
            <div class="workspace-secondary-actions">
              <button id="workspace-doctor" type="button" class="btn-ghost" data-i18n="workspaces.doctor">Check</button>
              <button id="workspace-fix" type="button" class="btn-ghost" data-i18n="workspaces.fix">Fix</button>
            </div>
            <ul id="workspace-checks" class="repair-checks" hidden></ul>
            <p id="workspace-hint" class="section-footnote"></p>
          </section>
        </section>
      </div>

      <footer class="widget-footer">
        <p id="status" class="status-footnote" hidden data-i18n="doctor.loading">加载中…</p>
        <span data-i18n="app.footer">本机 Runtime 发现 · 配置 · 健康检查</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
