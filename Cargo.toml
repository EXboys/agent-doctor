[workspace]
resolver = "2"
members = ["crates/agent-doctor-core", "crates/agent-doctor-mcp", "crates/agent-doctor-ocr", "crates/agent-doctor-prompt", "crates/agent-doctor-repair", "crates/agent-doctor-voice", "cli", "desktop/src-tauri"]

[workspace.package]
version = "0.1.93-beta.3"
edition = "2021"
license = "MIT"
authors = ["Agent Doctor Contributors"]

[workspace.dependencies]
agent-doctor-core = { path = "crates/agent-doctor-core" }
agent-doctor-mcp = { path = "crates/agent-doctor-mcp" }
agent-doctor-ocr = { path = "crates/agent-doctor-ocr" }
agent-doctor-prompt = { path = "crates/agent-doctor-prompt" }
agent-doctor-repair = { path = "crates/agent-doctor-repair" }
agent-doctor-voice = { path = "crates/agent-doctor-voice" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = "0.22"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
