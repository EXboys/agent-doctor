[workspace]
resolver = "2"
members = ["crates/agent-doctor-core", "crates/agent-doctor-mcp", "cli", "desktop/src-tauri"]

[workspace.package]
version = "0.1.15"
edition = "2021"
license = "MIT"
authors = ["Agent Doctor Contributors"]

[workspace.dependencies]
agent-doctor-core = { path = "crates/agent-doctor-core" }
agent-doctor-mcp = { path = "crates/agent-doctor-mcp" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml_edit = "0.22"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
